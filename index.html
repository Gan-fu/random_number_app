<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ランダム数字表示</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      font-size: 20px;
    }

    input {
      font-size: 20px;
      width: 80px;
      text-align: center;
      margin: 10px;
    }

    button {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      font-size: 22px;
      border-radius: 10px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    #result {
      font-size: 60px;
      margin-top: 30px;
      font-weight: bold;
      min-height: 80px;
    }

    /* 数字が出るときのアニメーション */
    .pop {
      animation: popAnimation 0.4s ease-out;
    }

    @keyframes popAnimation {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>
  <h2>ランダム数字表示</h2>

  <label>最小値: <input type="number" id="min" value="1"></label><br>
  <label>最大値: <input type="number" id="max" value="20"></label><br><br>

  <button onclick="start()">設定を反映</button>
  <button onclick="showRandom()">ランダム数字を表示</button>
  <button onclick="resetNumbers()">リセット</button>

  <div id="result"></div>

  <script>
    let numbers = [];

    function start() {
      const min = Number(document.getElementById("min").value);
      const max = Number(document.getElementById("max").value);

      numbers = [];
      for (let i = min; i <= max; i++) {
        numbers.push(i);
      }

      showMessage("設定しました");
    }

    function showRandom() {
      if (numbers.length === 0) {
        showMessage("すべての数字が出ました");
        return;
      }

      const index = Math.floor(Math.random() * numbers.length);
      const value = numbers[index];

      numbers.splice(index, 1);

      const result = document.getElementById("result");
      result.textContent = value;

      // アニメーション付与
      result.classList.remove("pop");
      void result.offsetWidth; // 強制再描画（アニメーションを毎回発火させるため）
      result.classList.add("pop");
    }

    function resetNumbers() {
      start();
      showMessage("リセットしました");
    }

    function showMessage(msg) {
      const result = document.getElementById("result");
      result.textContent = msg;

      result.classList.remove("pop");
      void result.offsetWidth;
      result.classList.add("pop");
    }
  </script>
</body>
</html>
