<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ランダム数字表示アプリ</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      font-size: 20px;
    }

    input {
      font-size: 20px;
      width: 80px;
      text-align: center;
      margin: 10px;
    }

    /* 上部のスタート/ストップボタン */
    #startStopBtn {
      width: 80%;
      padding: 60px;
      font-size: 60px;
      border-radius: 12px;
      border: none;
      background-color: #ff9800;
      color: white;
      margin: 20px 0;
    }

    #startStopBtn:hover {
      background-color: #e68900;
    }

    /* 下部の操作ボタン */
    .bottom-btn {
      width: 100%;
      padding: 18px;
      margin-top: 100px;
      margin: 10px 0;
      font-size: 22px;
      border-radius: 10px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    /* 説明ボタン */
    #infoBtn {
      width: 100%;
      padding: 20px;
      margin-top: 40px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      background-color: #2196F3; /* 青系に変更 */
      color: white;
      cursor: pointer;
    }

    #infoBtn:hover {
      background-color: #1976D2;
    }

    #bottomArea {
        margin-top: 40px;  
    }

    .bottom-btn:hover {
      background-color: #45a049;
    }

    #result { /* 出力される数字 */
      font-size: 400px;
      margin-top: 30px;
      font-weight: bold;
      min-height: 80px;
    }

    #message {
      font-size: 20px;
      margin-top: 1800px;
      color: #555;
      text-align: center;
    }

    /* 数字が出るときのアニメーション */
    .pop {
      animation: popAnimation 0.4s ease-out;
    }

    @keyframes popAnimation {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* 履歴表示 */
    #history {
      margin-top: 30px;
      font-size: 20px;
      text-align: left;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      min-height: 50px;
    }

    #cancelBtn {
      background-color: #f44336; /* 赤系 */
      color: white;
    }

    #cancelBtn:hover {
      background-color: #d32f2f;
    }

  </style>
</head>

<body>
  <h2>ランダム数字表示アプリ</h2>

  <!-- 上部：スタート/ストップ -->
  <button onclick="toggleStartStop()" id="startStopBtn">スタート</button>

  <div id="result"></div>

  <div id="message"></div>
  
  <!-- 下部：設定・リセット・履歴 -->
  <div id="bottomArea">
    <label>最小値: <input type="number" id="min" value="1"></label><br>
    <label>最大値: <input type="number" id="max" value="20"></label><br><br>
    <button onclick="startSetting()" class="bottom-btn">設定を反映</button>
    <button onclick="resetNumbers()" class="bottom-btn">リセット</button>

    <button onclick="cancelRandom()" class="bottom-btn" id="cancelBtn">抽選を中止する</button>
    
    <label>除外する数字（カンマ区切り）: <input type="text" id="excludeNum"></label>
    <button onclick="excludeNumber()" class="bottom-btn">除外を反映</button>
    
    <button onclick="showHistory()" class="bottom-btn">履歴を表示</button>
    <button onclick="showRemaining()" class="bottom-btn">残りの数字を表示</button>
  </div>

  <div id="history"></div>

  <!-- 最下部：使い方ページへ移動 -->
  <button onclick="location.href='explanation.html'" id="infoBtn">使い方・機能説明</button>

  <script>
    let numbers = [];
    let historyList = [];
    let intervalId = null;
    let isRunning = false;

    function startSetting() {
      const min = Number(document.getElementById("min").value);
      const max = Number(document.getElementById("max").value);

      numbers = [];
      historyList = [];
      document.getElementById("history").textContent = "";

      for (let i = min; i <= max; i++) {
        numbers.push(i);
      }

      showMessage("設定しました");
    }

    function toggleStartStop() {
      const btn = document.getElementById("startStopBtn");

      if (!isRunning) {
        if (numbers.length === 0) {
          showMessage("数字がありません");
          return;
        }

        isRunning = true;
        btn.textContent = "ストップ";

        intervalId = setInterval(() => {
          const index = Math.floor(Math.random() * numbers.length);
          const value = numbers[index];
          showNumber(value);
        }, 80);

      } else {
        clearInterval(intervalId);
        isRunning = false;
        btn.textContent = "スタート";

        const current = Number(document.getElementById("result").textContent);

        const idx = numbers.indexOf(current);
        if (idx !== -1) numbers.splice(idx, 1);

        historyList.push(current);
        showNumber(current);
      }
    }

    function resetNumbers() {
      startSetting();
      showMessage("リセットしました");
    }

    function showNumber(num) {
      const result = document.getElementById("result");
      result.textContent = num;

      result.classList.remove("pop");
      void result.offsetWidth;
      result.classList.add("pop");
    }

    function showMessage(msg) {
      const message = document.getElementById("message");
      message.textContent = msg;

      // 2秒後にメッセージを消す
      setTimeout(() => {
        message.textContent = "";
      }, 2000);
    }

    function showHistory() {
      const historyDiv = document.getElementById("history");

      if (historyList.length === 0) {
        historyDiv.textContent = "まだ数字が出ていません";
        return;
      }

      historyDiv.textContent = "出た数字: " + historyList.join(", ");
    }

    function excludeNumber() {
      const input = document.getElementById("excludeNum").value;

      if (!input) {
        showMessage("数字が入力されていません");
        return;
      }

      // カンマ区切りで複数の数字を取得
      const excludeValues = input.split(",").map(v => Number(v.trim()));

      let removed = [];

      excludeValues.forEach(val => {
        if (numbers.includes(val)) {
          numbers = numbers.filter(n => n !== val);
          removed.push(val);
        }
      });

      if (removed.length > 0) {
        showMessage(`数字 ${removed.join(", ")} を除外しました`);
      } else {
        showMessage("除外できる数字がありませんでした");
      }
    }

    function showRemaining() {
      const historyDiv = document.getElementById("history");

      if (numbers.length === 0) {
        historyDiv.textContent = "残りの数字はありません（すべて出ました）";
        return;
      }

      historyDiv.textContent = "残りの数字: " + numbers.join(", ");
    }
    
    function cancelRandom() {
      if (!isRunning) {
        showMessage("抽選は開始されていません");
        return;
      }

      clearInterval(intervalId);
      isRunning = false;

      const btn = document.getElementById("startStopBtn");
      btn.textContent = "スタート";

      showMessage("抽選を中止しました（数字は確定されません）");
    }

  </script>
</body>
</html>
