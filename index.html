<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ランダム数字表示</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      font-size: 20px;
    }

    input {
      font-size: 20px;
      width: 80px;
      text-align: center;
      margin: 10px;
    }

    /* 上部のスタート/ストップボタン */
    #startStopBtn {
      width: 80%;
      padding: 60px;
      font-size: 60px;
      border-radius: 12px;
      border: none;
      background-color: #ff9800;
      color: white;
      margin: 20px 0;
    }

    #startStopBtn:hover {
      background-color: #e68900;
    }

    /* 下部の操作ボタン */
    .bottom-btn {
      width: 100%;
      padding: 18px;
      margin-top: 100px;
      margin: 10px 0;
      font-size: 22px;
      border-radius: 10px;
      border: none;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    #bottomArea {
      margin-top: 2000px;   /* ← ここで下部ボタン全体を下に移動 */
    }

    .bottom-btn:hover {
      background-color: #45a049;
    }

    #result { /* 出力される数字 */
      font-size: 400px;
      margin-top: 30px;
      font-weight: bold;
      min-height: 80px;
    }

    #message {
      font-size: 20px;
      margin-top: 10px;
      color: #555;
    }


    /* 数字が出るときのアニメーション */
    .pop {
      animation: popAnimation 0.4s ease-out;
    }

    @keyframes popAnimation {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    /* 履歴表示 */
    #history {
      margin-top: 30px;
      font-size: 20px;
      text-align: left;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      min-height: 50px;
    }
  </style>
</head>

<body>
  <h2>ランダム数字表示</h2>

  <label>最小値: <input type="number" id="min" value="1"></label><br>
  <label>最大値: <input type="number" id="max" value="20"></label><br><br>

  <!-- 上部：スタート/ストップ -->
  <button onclick="toggleStartStop()" id="startStopBtn">スタート</button>

  <div id="result"></div>

  <div id="message"></div>

  <!-- 下部：設定・リセット・履歴 -->
  <div id="bottomArea">
    <button onclick="startSetting()" class="bottom-btn">設定を反映</button>
    <button onclick="resetNumbers()" class="bottom-btn">リセット</button>
    <button onclick="showHistory()" class="bottom-btn">履歴を表示</button>
  </div>

  <div id="history"></div>

  <script>
    let numbers = [];
    let historyList = [];
    let intervalId = null;
    let isRunning = false;

    function startSetting() {
      const min = Number(document.getElementById("min").value);
      const max = Number(document.getElementById("max").value);

      numbers = [];
      historyList = [];
      document.getElementById("history").textContent = "";

      for (let i = min; i <= max; i++) {
        numbers.push(i);
      }

      showMessage("設定しました");
    }

    function toggleStartStop() {
      const btn = document.getElementById("startStopBtn");

      if (!isRunning) {
        if (numbers.length === 0) {
          showMessage("数字がありません");
          return;
        }

        isRunning = true;
        btn.textContent = "ストップ";

        intervalId = setInterval(() => {
          const index = Math.floor(Math.random() * numbers.length);
          const value = numbers[index];
          showNumber(value);
        }, 80);

      } else {
        clearInterval(intervalId);
        isRunning = false;
        btn.textContent = "スタート";

        const current = Number(document.getElementById("result").textContent);

        const idx = numbers.indexOf(current);
        if (idx !== -1) numbers.splice(idx, 1);

        historyList.push(current);
        showNumber(current);
      }
    }

    function resetNumbers() {
      startSetting();
      showMessage("リセットしました");
    }

    function showNumber(num) {
      const result = document.getElementById("result");
      result.textContent = num;

      result.classList.remove("pop");
      void result.offsetWidth;
      result.classList.add("pop");
    }

    function showMessage(msg) {
      const message = document.getElementById("message");
      message.textContent = msg;

      // 2秒後にメッセージを消す
      setTimeout(() => {
        message.textContent = "";
      }, 2000);
    }

    function showHistory() {
      const historyDiv = document.getElementById("history");

      if (historyList.length === 0) {
        historyDiv.textContent = "まだ数字が出ていません";
        return;
      }

      historyDiv.textContent = "出た数字: " + historyList.join(", ");
    }
  </script>
</body>
</html>
